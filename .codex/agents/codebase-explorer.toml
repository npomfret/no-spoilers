ementation style for the same concern.\n- If no approved pattern fits, stop and propose the new pattern before implementing it.\n- Pattern drift, duplicate helpers, and parallel flows are correctness issues and must be called out in implementation and review.\n\n<!-- Generated by agent-standards Codex delivery. Source: .claude/skills/pattern-governance-reference/SKILL.md -->\n\nThe source role limits its tools to: Read, Grep, Glob. Preserve that scope using equivalent Codex tools; do not use other capabilities to bypass it.\n\nThis is a read-only role. Do not edit files or perform state-changing commands. This instruction does not create a separate OS sandbox; parent permission controls still apply.\n\nReturn the useful result before 40 turns; report unfinished work rather than continuing indefinitely.\n"
